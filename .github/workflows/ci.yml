name: Python checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile source and notebook JSON
        run: |
          python -m py_compile src/ids_pipeline.py src/download_dataset.py
          python -m json.tool src/IDS_UNSW_NB15.ipynb >/dev/null
      - name: Run tests
        run: python -m pytest -q
